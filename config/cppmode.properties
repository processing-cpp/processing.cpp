mkdir -p ~/sketchbook/modes/CppMode/config
cat > ~/sketchbook/modes/CppMode/config/cppmode.properties << 'EOF'
# Single source of truth for CppMode-wide settings. Both CppBuild.java
# and scripts/rebuild-engine.sh read this file directly, so changing
# either value here updates behavior everywhere at once instead of
# needing to hunt through multiple files.

# Set to 1 to enable PDEBUG output and other diagnostic traces in the
# compiled engine; 0 for a normal/release build. See scripts/rebuild-engine.sh.
debug=0

# Base URL for the CppMode website. Used to build every link CppMode
# shows the user (error reference pages, etc.) -- changing the site's
# domain only ever requires editing this one line.
website.base.url=https://processing-cpp.github.io
EOF
